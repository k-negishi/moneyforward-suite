# pnpm workspace の定義（ADR-0005）。Application（apps/*）と共有 package（packages/*）のみを対象にする。
# 将来用の空 package は追加しない（ADR-0005）。
packages:
  - apps/*
  - packages/*
# pnpm 12 の供給網ポリシー（minimumReleaseAge）により、公開直後のバージョンは既定で選択されない。
# このエントリは pnpm が初回 install 時に自動追記した「明示的に許可した例外」。
# @types/node を Node 22 系の最新へ揃えるために必要な最小限の除外にとどめる。
minimumReleaseAgeExclude:
  - '@types/node@22.20.5'
# engines（package.json の range。Node 22.20+ / 24.x / 26+）を満たさない環境では install を失敗させる（実測で確認済み）。
# pnpm 12 は .npmrc の engine-strict を読まないため、pnpm での実効はこちらの設定になる
# （package.json の engines を満たさない Node で ERR_PNPM_UNSUPPORTED_ENGINE になることを検証済み）。
engineStrict: true
