# Pull Request と master への push で、Secret を使わない基本の品質ゲートを実行する。
# 実アカウント・認証セッションは使わない（ブラウザテストは合成 HTML のみを描画する）。
name: CI

on:
  pull_request:
  push:
    branches: [master]

# リポジトリ内容の読み取りだけを必要とする（Secret も書き込み権限も使わない）。
permissions:
  contents: read

# 同一ブランチの多重実行をキャンセルして、古い実行結果を残さない。
# master への push は履歴を残すためキャンセル対象にしない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pnpm install 時の postinstall によるブラウザ取得は抑止する（取得は下の明示的な
  # playwright install ステップだけで行う。この変数は playwright install コマンド自体には
  # 影響しないため、必要なブラウザはそちらで取得できる）。
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: 品質ゲート（install / build / typecheck / test）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action はタグが upstream で付け替えられ得るため、すべてレビュー済みリリースの
      # commit SHA に固定する（併記したコメントが対応するタグ）。
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のステップで git 操作をしないため、認証情報の永続化は無効にする（多層防御）。
          persist-credentials: false

      # corepack を使わず、package.json の packageManager と同じバージョンを導入する。
      # version は省略し、packageManager を単一情報源にして二重管理を避ける。
      - name: pnpm を導入する（packageManager と同じバージョン）
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node.js を導入する（.node-version と pnpm キャッシュ）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 依存を lockfile 固定でインストールする
        run: pnpm install --frozen-lockfile

      # lint の診断には noSecrets の候補文字列が含まれ得るため、生の出力はログへ流さず、
      # レポートを一時ファイル（ランナー内で消える。Artifact として保存しない）へ書き出し、
      # 失敗時はルール ID と対象ファイルの位置だけを表示する（Minimal Logging）。
      # 位置は診断 JSON の location.path と location.start.line から取る。path が
      # オブジェクト（{ file }）の形になっても表示が壊れないように両対応にする。
      - name: lint を実行する
        run: |
          status=0
          pnpm exec biome ci --error-on-warnings . \
            --reporter=json --reporter-file="$RUNNER_TEMP/biome-diagnostics.json" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          echo 'lint が失敗しました。ルール ID と対象ファイルの位置だけを表示します。'
          jq -r '.diagnostics[] | "\(.category) \((.location.path | if type == "object" then .file else . end) // "?"):\(.location.start.line // "?")"' \
            "$RUNNER_TEMP/biome-diagnostics.json"
          exit "$status"

      # Adapter のブラウザテストは実 chromium を使う。取得物は lockfile（playwright の
      # バージョン）に紐づけてキャッシュし、一致するキャッシュがあれば再取得しない。
      - name: Playwright のブラウザをキャッシュする
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # chromium だけを取得する（--with-deps でランナーの OS 依存も導入する）。
      # 上記のキャッシュが当たればダウンロードはスキップされる。
      - name: chromium を取得する（ブラウザテスト用）
        run: pnpm --filter @mf-suite/adapter-moneyforward-playwright exec playwright install --with-deps chromium

      - name: 全 workspace をビルドする
        run: pnpm build

      - name: 全 workspace とリポジトリ横断テストを型検査する
        run: pnpm typecheck

      # 依存境界（Hexagonal Architecture）の違反を、レビュー以前に CI で止める。
      # 違反時は検出した import の file:line と指定子が出力される。
      - name: 依存境界（Architecture Test）を検証する
        run: pnpm test:architecture

      # リポジトリ横断のポリシー検査（保存 Action・コメント規約・Biome 設定）を、全テストの
      # 実行（pnpm test）とは別のステップでも必ず実行する。テストの対象が変わっても検査が
      # 走らなかったり、対象 0 件のまま成功したりする事故を防ぐ。
      - name: リポジトリ横断のポリシー検査を実行する
        run: pnpm test:repo-policy

      # 失敗時は Vitest の出力に project 名（@mf-suite/* と repo-policy）が出る。
      - name: 全 workspace とリポジトリ横断のテストを実行する
        run: pnpm test
